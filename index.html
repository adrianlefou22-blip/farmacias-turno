<style>
  :root {
    --green: #00C853;
    --green-bg: #f2fbf5;
    --green-light: #e8f8ee;
    --bg: #f4f4f6;
    --white: #fff;
    --text: #111;
    --muted: #888;
    --border: #e8e8ec;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { background:var(--bg); font-family:'DM Sans',sans-serif; color:var(--text); min-height:100vh; }
  .app { max-width:480px; margin:0 auto; padding-bottom:calc(70px + var(--safe-bottom)); }

  /* HEADER */
  .header {
    background:var(--white); border-bottom:1px solid var(--border);
    padding: calc(14px + var(--safe-top)) 18px 13px;
    position:sticky; top:0; z-index:50;
  }
  .header-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:3px; }
  .header-title { font-size:18px; font-weight:700; }
  .header-title span { color:var(--green); }
  .date-chip { background:var(--green); color:#fff; font-size:12px; font-weight:700; padding:4px 11px; border-radius:999px; }
  .header-sub { font-size:12px; color:var(--muted); }

  /* BANNER — aviso nuevo mes */
  .banner {
    display:none; align-items:center; gap:10px;
    padding:10px 16px; font-size:13px;
    border-bottom:1px solid;
  }
  .banner.show { display:flex; }
  .banner.new-month { background:#fff8e1; border-color:#ffe082; color:#7a6000; }
  .banner.updated   { background:#e8f8ee; border-color:#a5d6a7; color:#1b5e20; }
  .banner.error     { background:#fff3f3; border-color:#ffcdd2; color:#b71c1c; }
  .banner a, .banner button {
    margin-left:auto; color:var(--green); font-weight:700;
    background:none; border:none; font-family:'DM Sans',sans-serif;
    font-size:13px; cursor:pointer; white-space:nowrap; text-decoration:none;
    padding:0;
  }

  /* ADMIN PANEL — oculto, se activa con 5 taps en el título */
  .admin-panel {
    display:none;
    background:#1a1a2e; color:#fff;
    padding:16px 18px; border-bottom:2px solid var(--green);
  }
  .admin-panel.show { display:block; }
  .admin-title { font-size:13px; font-weight:700; color:var(--green); letter-spacing:1px; text-transform:uppercase; margin-bottom:12px; }
  .admin-input {
    width:100%; background:#0f0f23; border:1px solid #333; border-radius:10px;
    padding:10px 14px; font-size:14px; color:#fff; font-family:'DM Sans',sans-serif;
    outline:none; margin-bottom:10px;
  }
  .admin-input:focus { border-color:var(--green); }
  .admin-input::placeholder { color:#555; }
  .btn-update {
    width:100%; background:var(--green); color:#000; border:none; border-radius:10px;
    padding:12px; font-size:15px; font-weight:700; font-family:'DM Sans',sans-serif;
    cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
    transition:opacity .15s;
  }
  .btn-update:disabled { opacity:.5; cursor:not-allowed; }
  .admin-status { font-size:12px; color:#888; margin-top:8px; text-align:center; min-height:18px; }

  /* TABS */
  .tabs { background:var(--white); border-bottom:1px solid var(--border); display:flex; }
  .tab {
    flex:1;
    padding:10px 6px 10px;
    font-size:12px; font-weight:700; color:var(--muted);
    background:none; border:none; border-bottom:2.5px solid transparent;
    cursor:pointer; transition:color .15s,border-color .15s;
    display:flex; flex-direction:column; align-items:center; gap:2px;
    line-height:1.2; text-align:center;
  }
  .tab .tab-main { font-size:13px; font-weight:700; }
  .tab .tab-sub  { font-size:10px; font-weight:500; color:#bbb; }
  .tab.active { color:var(--green); border-bottom-color:var(--green); }
  .tab.active .tab-sub { color:rgba(0,200,83,0.6); }

  /* SECTIONS */
  .section { display:none; padding:14px; animation:up .2s ease; }
  .section.visible { display:block; }
  @keyframes up { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }

  /* DUTY CARD */
  .duty-card { background:var(--white); border:2px solid var(--green); border-radius:16px; padding:16px 18px; margin-bottom:8px; box-shadow:0 2px 12px rgba(0,200,83,0.1); }
  .duty-label { font-size:10px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--green); margin-bottom:8px; }
  .duty-name { font-size:24px; font-weight:700; line-height:1.1; margin-bottom:4px; }
  .duty-address { font-size:14px; color:var(--muted); margin-bottom:13px; line-height:1.4; }
  .btn-call { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; background:var(--green); color:#fff; border:none; border-radius:11px; padding:13px; font-size:17px; font-weight:700; font-family:'DM Sans',sans-serif; text-decoration:none; cursor:pointer; }
  .btn-call svg { width:18px; height:18px; fill:#fff; }
  .btn-no-tel { width:100%; background:var(--border); color:var(--muted); border:none; border-radius:11px; padding:13px; font-size:13px; font-weight:600; text-align:center; }

  .duty-note { font-size:12px; color:#bbb; text-align:center; margin:4px 0 18px; line-height:1.5; }
  .duty-note b { color:var(--muted); }

  /* LISTA */
  .loc-group { margin-bottom:18px; }
  .loc-title { font-size:10px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:#bbb; margin-bottom:7px; padding-left:2px; }
  .pharm-row { background:var(--white); border:1px solid var(--border); border-radius:13px; padding:12px 14px; display:flex; align-items:center; gap:12px; margin-bottom:5px; }
  .pharm-row.on-duty { border-color:var(--green); background:var(--green-bg); }
  .pharm-info { flex:1; min-width:0; }
  .pharm-name { font-size:15px; font-weight:600; margin-bottom:2px; }
  .hoy { font-size:10px; font-weight:700; color:var(--green); margin-left:5px; vertical-align:middle; }
  .pharm-addr { font-size:12px; color:var(--muted); line-height:1.35; }
  .call-btn { flex-shrink:0; width:40px; height:40px; border-radius:11px; background:var(--green-light); display:flex; align-items:center; justify-content:center; text-decoration:none; }
  .call-btn svg { width:17px; height:17px; fill:var(--green); }
  .no-btn { width:40px; height:40px; flex-shrink:0; }

  /* SEARCH */
  .search-wrap { padding:14px; }
  .search-input { width:100%; background:var(--white); border:1px solid var(--border); border-radius:13px; padding:13px 16px; font-size:16px; font-family:'DM Sans',sans-serif; color:var(--text); outline:none; transition:border-color .2s; margin-bottom:12px; }
  .search-input:focus { border-color:var(--green); }
  .search-input::placeholder { color:#ccc; }

  /* LOADING */
  .loading { text-align:center; padding:50px 20px; color:var(--muted); font-size:14px; }
  .spinner { width:28px; height:28px; border:3px solid var(--border); border-top-color:var(--green); border-radius:50%; animation:spin .7s linear infinite; margin:0 auto 12px; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* NAV */
  .bottom-nav { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; background:var(--white); border-top:1px solid var(--border); display:flex; padding:6px 0 calc(10px + var(--safe-bottom)); z-index:100; }
  .nav-btn { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; background:none; border:none; cursor:pointer; padding:7px 0; font-size:10px; font-weight:600; font-family:'DM Sans',sans-serif; color:#ccc; transition:color .15s; }
  .nav-btn svg { width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.8; }
  .nav-btn.active { color:var(--green); }

  .view { display:none; }
  .view.active { display:block; }
  .empty { text-align:center; padding:40px 20px; color:#ccc; font-size:14px; line-height:1.8; }
</style>

// ═══════════════════════════════════════════════════════════
// ESTADO GLOBAL
// ═══════════════════════════════════════════════════════════
const DIAS  = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const PHONE = `<svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.35 2 2 0 0 1 3.6 1h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.6a16 16 0 0 0 6.12 6.12l.96-.96a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>`;

let APP_DATA   = null; // datos del servidor
let todayDay   = null;
let tapCount   = 0;
let tapTimer   = null;

// ═══════════════════════════════════════════════════════════
// CARGAR DATOS DESDE EL SERVIDOR
// ═══════════════════════════════════════════════════════════
async function loadData() {
  try {
    const res = await fetch('/.netlify/functions/data');
    if (!res.ok) return null;
    const data = await res.json();
    if (!data || data.error) return null;
    return data;
  } catch (err) {
    return null;
  }
}

// ═══════════════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════════════
function getShift(zk, day) {
  if (!APP_DATA || !day) return null;
  const cal = APP_DATA.calendars[zk];
  return cal && cal[day - 1] ? cal[day - 1] : null;
}

function shiftHas(shift, letter) {
  return shift ? shift.split('/').includes(letter) : false;
}

function onDutyPharms(zk, shift) {
  if (!APP_DATA || !shift) return [];
  const result = [];
  Object.entries(APP_DATA.localities[zk]).forEach(([loc, arr]) =>
    arr.forEach(p => { if (shiftHas(shift, p.shift)) result.push({...p, loc}); })
  );
  return result;
}

function callBig(p) {
  if (!p.tel) return `<div class="btn-no-tel">Sin teléfono registrado</div>`;
  return `<a class="btn-call" href="tel:${p.tel}">${PHONE} ${p.tel}</a>`;
}
function callSmall(p) {
  if (!p.tel) return `<div class="no-btn"></div>`;
  return `<a class="call-btn" href="tel:${p.tel}">${PHONE}</a>`;
}

// ═══════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════
function renderSection(zk) {
  const shift  = getShift(zk, todayDay);
  const onDuty = onDutyPharms(zk, shift);
  let html = '';

  // Turno hoy
  if (onDuty.length) {
    onDuty.forEach(p => {
      html += `<div class="duty-card">
        <div class="duty-label">🟢 De turno hoy</div>
        <div class="duty-name">${p.name}</div>
        <div class="duty-address">${p.address} — <strong>${p.loc}</strong></div>
        ${callBig(p)}
      </div>`;
    });
  } else {
    html += `<div class="empty">Sin datos para hoy</div>`;
  }
  html += `<div class="duty-note">Turno <b>8:30 hs</b> hoy → <b>8:30 hs</b> mañana</div>`;

  // Lista por localidad
  Object.entries(APP_DATA.localities[zk]).forEach(([loc, pharms]) => {
    html += `<div class="loc-group"><div class="loc-title">${loc}</div>`;
    pharms.forEach(p => {
      const isOn = shiftHas(shift, p.shift);
      html += `<div class="pharm-row${isOn?' on-duty':''}">
        <div class="pharm-info">
          <div class="pharm-name">${p.name}${isOn?'<span class="hoy">● HOY</span>':''}</div>
          <div class="pharm-addr">${p.address}</div>
        </div>
        ${callSmall(p)}
      </div>`;
    });
    html += `</div>`;
  });

  return html;
}

function renderAll() {
  ['tortuguitas','polvorines','grandbourg'].forEach(zk => {
    document.getElementById(`zone-${zk}`).innerHTML = renderSection(zk);
  });
}

async function init() {
  const now = new Date();
  todayDay = now.getDate();

  document.getElementById('chip-date').textContent = `${now.getDate()} de ${MESES[now.getMonth()]}`;
  document.getElementById('sub-date').textContent  = `${DIAS[now.getDay()]} · turno desde las 8:30 hs`;

  // Mostrar fallback INMEDIATAMENTE sin esperar al servidor
  APP_DATA = FALLBACK;
  const fallbackIsCurrentMonth = FALLBACK.month === now.getMonth() && FALLBACK.year === now.getFullYear();
  todayDay = fallbackIsCurrentMonth ? now.getDate() : null;
  renderAll();

  // Intentar actualizar desde el servidor en segundo plano
  const serverData = await loadData();
  if (serverData) {
    APP_DATA = serverData;
    const dataIsCurrentMonth = APP_DATA.month === now.getMonth() && APP_DATA.year === now.getFullYear();
    todayDay = dataIsCurrentMonth ? now.getDate() : null;
    if (!dataIsCurrentMonth) document.getElementById('banner-month').classList.add('show');
    renderAll();
  }
}

// ═══════════════════════════════════════════════════════════
// ADMIN — 5 taps en el título
// ═══════════════════════════════════════════════════════════
document.getElementById('tap-title').addEventListener('click', () => {
  tapCount++;
  clearTimeout(tapTimer);
  tapTimer = setTimeout(() => { tapCount = 0; }, 2000);
  if (tapCount >= 5) {
    tapCount = 0;
    const panel = document.getElementById('admin-panel');
    panel.classList.toggle('show');
    if (panel.classList.contains('show')) {
      document.getElementById('admin-secret').focus();
    }
  }
});

async function doUpdate() {
  const secret = document.getElementById('admin-secret').value.trim();
  if (!secret) { document.getElementById('admin-status').textContent = '⚠️ Ingresá la contraseña'; return; }

  const jsonText = document.getElementById('admin-json').value.trim();
  if (!jsonText) { document.getElementById('admin-status').textContent = '⚠️ Pegá el JSON de Claude'; return; }

  let parsed;
  try {
    parsed = JSON.parse(jsonText);
  } catch(e) {
    document.getElementById('admin-status').textContent = '⚠️ El JSON no es válido — copialo de nuevo de Claude';
    return;
  }

  const { month, year, calendars } = parsed;
  if (!month || !year || !calendars) {
    document.getElementById('admin-status').textContent = '⚠️ JSON incompleto — pedile a Claude que lo regenere';
    return;
  }

  const btn = document.getElementById('btn-update');
  btn.disabled = true;
  btn.innerHTML = `<div style="width:18px;height:18px;border:2px solid #000;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite"></div> Guardando...`;
  document.getElementById('admin-status').textContent = 'Guardando datos...';

  try {
    const res  = await fetch('/.netlify/functions/update', {
      method: 'POST',
      headers: { 'Authorization': secret, 'Content-Type': 'application/json' },
      body: JSON.stringify({ month, year, calendars })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `Error ${res.status}`);

    document.getElementById('admin-status').textContent = `✅ Guardado — ${month}/${year}`;
    APP_DATA = await loadData();
    if (APP_DATA) { todayDay = new Date().getDate(); renderAll(); }
    document.getElementById('banner-month').classList.remove('show');
    document.getElementById('banner-ok').style.display = 'flex';
    document.getElementById('admin-panel').classList.remove('show');
    document.getElementById('admin-json').value = '';

  } catch (err) {
    document.getElementById('admin-status').textContent = `❌ ${err.message}`;
  } finally {
    btn.disabled = false;
    btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.5"/></svg> Guardar turnos del mes`;
  }
}

function togglePass() {
  const input = document.getElementById('admin-secret');
  const btn   = document.getElementById('eye-btn');
  if (input.type === 'password') {
    input.type = 'text';
    btn.textContent = '🙈';
  } else {
    input.type = 'password';
    btn.textContent = '👁';
  }
}

function hideBanner() {
  document.getElementById('banner-month').classList.remove('show');
}

// ═══════════════════════════════════════════════════════════
// ZONE / NAV / SEARCH
// ═══════════════════════════════════════════════════════════
function showZone(zone, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.section').forEach(s => s.classList.remove('visible'));
  document.getElementById(`zone-${zone}`).classList.add('visible');
}

function switchView(view) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(`view-${view}`).classList.add('active');
  document.getElementById(`nav-${view}`).classList.add('active');
  if (view === 'search') setTimeout(() => document.getElementById('search-input').focus(), 80);
}

function getAllPharms() {
  if (!APP_DATA) return [];
  const all = [];
  Object.entries(APP_DATA.localities).forEach(([zk, locs]) => {
    Object.entries(locs).forEach(([loc, pharms]) => {
      pharms.forEach(p => all.push({...p, loc, zk}));
    });
  });
  return all;
}

function doSearch(q) {
  q = q.toLowerCase().trim();
  const el = document.getElementById('search-results');
  if (!q) { el.innerHTML = `<div class="empty">Escribí para buscar</div>`; return; }
  const results = getAllPharms().filter(p =>
    p.name.toLowerCase().includes(q) || p.address.toLowerCase().includes(q) || p.loc.toLowerCase().includes(q)
  );
  if (!results.length) { el.innerHTML = `<div class="empty">Sin resultados</div>`; return; }
  const shifts = {};
  ['tortuguitas','polvorines','grandbourg'].forEach(zk => shifts[zk] = getShift(zk, todayDay));
  el.innerHTML = results.map(p => {
    const isOn = shiftHas(shifts[p.zk], p.shift);
    return `<div class="pharm-row${isOn?' on-duty':''}">
      <div class="pharm-info">
        <div class="pharm-name">${p.name}${isOn?'<span class="hoy">● HOY</span>':''}</div>
        <div class="pharm-addr">${p.address} · ${p.loc}</div>
      </div>
      ${callSmall(p)}
    </div>`;
  }).join('');
}

init();
</script>
